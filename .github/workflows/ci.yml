name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly, so a sibling's change that breaks this repository shows the next morning
  # rather than at the next push here.  The seven repositories' crons are staggered,
  # libraries first: ooxml-common 02:07, ooxml-edit 02:17, pptx2svg 02:37, docx2svg 02:47,
  # pptx-agent 03:07, docx-agent 03:17, xlsx-agent 03:27 (UTC).  The whole matrix, as a
  # push runs it.
  schedule:
    - cron: "37 2 * * *"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # 3.15.0 is out (2026-10-09) but setup-python's version list may still offer only
          # its release candidates; this takes a final release whenever there is one, so
          # it changes nothing for 3.10 to 3.14.
          allow-prereleases: true

      - name: Install
        # The font bundle is a sibling distribution inside this repository, not a PyPI
        # release, so it is installed from the checkout rather than resolved by name.
        #
        # ooxml-common is a runtime dependency that is not on PyPI yet either, so it is
        # installed from its repository first and `pip install -e .` then finds the
        # requirement already satisfied.  Once it is published, delete that line.
        #
        # It is @main, so an ooxml-common change this repository depends on lands there
        # first.  To test such a pair before it has, point this at the other branch
        # (`@<branch>`) on the pull request, and back at @main before merging.
        run: |
          python -m pip install --upgrade pip
          # TEMPORARY (s7): ooxml-common 0.33.0 (ooxml_common.raster) is on its raster-s7
          # branch until it is merged; point this line back at @main then.
          python -m pip install "ooxml-common @ git+https://github.com/uvrt/ooxml-common@raster-s7"
          python -m pip install -e .[dev]
          python -m pip install -e packages/pptx2svg-fonts

      - name: Test
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyproject.toml's version, and __version__, must be the one CHANGELOG.md's top
      # version section names: the tag workflow tags that version when it reaches main.
      - name: The version agrees with CHANGELOG.md
        run: python tools/check_version.py
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
