<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" width="960" height="540"><rect width="960" height="540" fill="#ffffff"/><g role="img" aria-label="Caption" data-pptx-id="260.14" data-pptx-path="0" transform="translate(48, 18.667)"><rect fill="none" stroke="none" width="864" height="29.333"/><text x="0" y="14.492" xml:space="preserve"><tspan x="0" dy="0" text-anchor="start" font-size="14.667" font-family="Arial, Arimo, sans-serif" font-weight="bold" fill="#0f172a">5  a:buSzPts - a bullet sized in points rather than in percent</tspan></text></g><g role="img" aria-label="Bullet sizes" data-pptx-id="260.218" data-pptx-path="1" transform="translate(48, 69.333)"><rect fill="none" stroke="none" width="826.667" height="240"/><text x="0" y="46.958" xml:space="preserve"><tspan x="9.6" dy="0" text-anchor="start" font-size="42.667" font-family="Arial, Arimo, sans-serif">•</tspan><tspan x="57.6" text-anchor="start" font-size="42.667" font-family="Arial, Arimo, sans-serif">no size given: the bullet takes the run's</tspan><tspan x="57.6" dy="51.20" text-anchor="start" font-size="42.667" font-family="Arial, Arimo, sans-serif">32 pt</tspan><tspan x="9.6" dy="51.20" text-anchor="start" font-size="21.333" font-family="Arial, Arimo, sans-serif">•</tspan><tspan x="57.6" text-anchor="start" font-size="42.667" font-family="Arial, Arimo, sans-serif">a:buSzPct 50%: half the run</tspan><tspan x="9.6" dy="51.20" text-anchor="start" font-size="13.333" font-family="Arial, Arimo, sans-serif">•</tspan><tspan x="57.6" text-anchor="start" font-size="42.667" font-family="Arial, Arimo, sans-serif">a:buSzPts 10 pt: absolute</tspan></text></g><g role="img" aria-label="Label" data-pptx-id="260.219" data-pptx-path="2" transform="translate(48, 336)"><rect fill="none" stroke="none" width="826.667" height="21.333"/><text x="0" y="11.857" xml:space="preserve"><tspan x="0" dy="0" text-anchor="start" font-size="12" font-family="Arial, Arimo, sans-serif" fill="#475569">Only a:buSzPct was read, so every a:buSzPts bullet silently took the run's size. Decks usually author the two equal, which is why the gap never showed.</tspan></text></g></svg>