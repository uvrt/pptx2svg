<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" width="960" height="540"><rect width="960" height="540" fill="#ffffff"/><g role="img" aria-label="Caption" data-pptx-id="258.12" data-pptx-path="0" transform="translate(48, 18.667)"><rect fill="none" stroke="none" width="864" height="29.333"/><text x="0" y="14.492" xml:space="preserve"><tspan x="0" dy="0" text-anchor="start" font-size="14.667" font-family="Arial, Arimo, sans-serif" font-weight="bold" fill="#0f172a">3  mc:AlternateContent - a Choice we can draw beats the Fallback</tspan></text></g><g role="img" aria-label="Reference" data-pptx-id="258.212" data-pptx-path="1" transform="translate(48, 69.333)"><image href="data:image/png;base64," x="0" y="0" width="320" height="80" preserveAspectRatio="none"/></g><g role="img" aria-label="Label" data-pptx-id="258.213" data-pptx-path="2" transform="translate(48, 160)"><rect fill="none" stroke="none" width="426.667" height="21.333"/><text x="0" y="11.857" xml:space="preserve"><tspan x="0" dy="0" text-anchor="start" font-size="12" font-family="Arial, Arimo, sans-serif" fill="#475569">a plain p:pic, in no branch at all</tspan></text></g><g role="img" aria-label="Choice vector" data-pptx-id="258.210" data-pptx-path="3" transform="translate(48, 202.667)"><image href="data:image/svg+xml;base64," x="0" y="0" width="320" height="80" preserveAspectRatio="none"/></g><g role="img" aria-label="Label" data-pptx-id="258.214" data-pptx-path="4" transform="translate(48, 293.333)"><rect fill="none" stroke="none" width="613.333" height="21.333"/><text x="0" y="11.857" xml:space="preserve"><tspan x="0" dy="0" text-anchor="start" font-size="12" font-family="Arial, Arimo, sans-serif" fill="#475569">mc:Choice (carries the vector) beside mc:Fallback (raster only)</tspan></text></g><g role="img" aria-label="Label" data-pptx-id="258.215" data-pptx-path="5" transform="translate(48, 349.333)"><rect fill="none" stroke="none" width="826.667" height="21.333"/><text x="0" y="11.857" xml:space="preserve"><tspan x="0" dy="0" text-anchor="start" font-size="12" font-family="Arial, Arimo, sans-serif" fill="#475569">Same artwork on both, for the reason slide 2 gives. The Choice is taken: the snapshot's second picture is data:image/svg+xml, where taking the Fallback</tspan><tspan x="0" dy="14.40" text-anchor="start" font-size="12" font-family="Arial, Arimo, sans-serif" fill="#475569">unconditionally -- which this used to do -- gave a PNG.</tspan></text></g></svg>