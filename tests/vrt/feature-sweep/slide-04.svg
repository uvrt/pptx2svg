<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" width="960" height="540"><rect width="960" height="540" fill="#ffffff"/><g role="img" aria-label="Caption" data-pptx-id="259.13" data-pptx-path="0" transform="translate(48, 18.667)"><rect fill="none" stroke="none" width="864" height="29.333"/><text x="0" y="14.492" xml:space="preserve"><tspan x="0" dy="0" text-anchor="start" font-size="14.667" font-family="Arial, Arimo, sans-serif" font-weight="bold" fill="#0f172a">4  a:buBlip - picture bullets</tspan></text></g><g role="img" aria-label="Picture bullets" data-pptx-id="259.216" data-pptx-path="1" transform="translate(48, 69.333)"><rect fill="none" stroke="none" width="533.333" height="160"/><text x="0" y="25.879" xml:space="preserve"><tspan x="57.6" dy="0" text-anchor="start" font-size="21.333" font-family="Arial, Arimo, sans-serif">Picture bullets come from a:buBlip</tspan><tspan x="57.6" dy="25.60" text-anchor="start" font-size="21.333" font-family="Arial, Arimo, sans-serif">They are not a character in any face</tspan><tspan x="57.6" dy="25.60" text-anchor="start" font-size="21.333" font-family="Arial, Arimo, sans-serif">So they cannot be a tspan the way buChar is</tspan></text><image x="9.6" y="4.546" width="21.333" height="21.333" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64,"/><image x="9.6" y="30.146" width="21.333" height="21.333" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64,"/><image x="9.6" y="55.746" width="21.333" height="21.333" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64,"/></g><g role="img" aria-label="Label" data-pptx-id="259.217" data-pptx-path="2" transform="translate(48, 242.667)"><rect fill="none" stroke="none" width="826.667" height="21.333"/><text x="0" y="11.857" xml:space="preserve"><tspan x="0" dy="0" text-anchor="start" font-size="12" font-family="Arial, Arimo, sans-serif" fill="#475569">a:buBlip -- a 32 px diamond with real alpha, drawn as &lt;image&gt; beside the &lt;text&gt; because &lt;image&gt; is not a text content element.</tspan></text></g></svg>