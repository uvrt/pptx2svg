[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pptx2svg"
version = "0.1.0"
description = "Render PowerPoint (.pptx) slides to SVG (and PNG) in pure Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Evert Koks" }]
keywords = ["pptx", "powerpoint", "svg", "png", "ooxml", "render"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Office/Business :: Office Suites",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# SVG -> PNG rasterisation. resvg-py ships prebuilt wheels, so this needs no compiler
# and no system libraries; it is the same renderer pptx-glimpse rasterises with.
png = ["resvg-py>=0.5"]
# Alternative backend for environments that already have Cairo. Its SVG filter support
# is weaker, so shadows and glows differ from resvg.
cairo = ["cairosvg>=2.7"]
# The recommended install.  Carries the font files pptx2svg draws with, so PNG output
# ignores the host's fonts entirely and the same deck rasterises to the same bytes
# everywhere.  A separate distribution rather than package data: this wheel stays ~100 kB
# and stdlib-only for the many callers who only want SVG (which embeds no fonts) or who
# supply their own via `font_dirs`.  Without it, rendering falls back to system fonts and
# says so through ConvertOptions.warnings -- see pptx2svg.fonts.
fonts = ["pptx2svg-fonts>=0.1"]
# Measure with real installed fonts instead of the bundled metric tables
# (FontToolsTextMeasurer), and regenerate the tables with tools/extract_font_metrics.py.
# Renamed from `fonts`, which now means the font files themselves.
measure = ["fonttools>=4.40"]
# Render the PDF preview Office embeds inside an EMF. Extracting the preview and the DIB
# variant of it are standard-library only; rasterising a PDF page is the one thing the
# stdlib cannot do, so it lives behind this extra and degrades to a placeholder without it.
metafile = ["pypdfium2>=4"]
# Scoring a render against PowerPoint's own PDF export (tools/fidelity.py).  Strictly a
# development concern: none of this is imported from src/, which stays standard-library
# only, and the harness itself also needs PowerPoint, which pip cannot supply.
fidelity = ["numpy>=1.24", "pillow>=10", "pypdfium2>=4"]
dev = [
  "pytest>=7",
  "resvg-py>=0.5",
  "fonttools>=4.40",
  "numpy>=1.24",
  "pillow>=10",
  "pypdfium2>=4",
]
# `pptx2svg-fonts` is deliberately NOT listed above.  It is a sibling distribution that
# lives in this repository at packages/pptx2svg-fonts and is not published yet, so naming
# it as a dependency makes `pip install -e '.[dev]'` fail outright against PyPI -- which
# is exactly what it did to CI on every platform.  Install it from the checkout instead:
#
#     pip install -e packages/pptx2svg-fonts
#
# The suite does not strictly require it: tests/conftest.py puts the bundle's src/ on
# sys.path when the directory is present, so a source checkout exercises the bundled-font
# configuration either way.  Installing it is the more faithful reproduction of what
# `pip install 'pptx2svg[fonts]'` gives a user, which is why CI does it.

[project.urls]
Homepage = "https://github.com/uvrt/pptx2svg"
Repository = "https://github.com/uvrt/pptx2svg"
Issues = "https://github.com/uvrt/pptx2svg/issues"
Changelog = "https://github.com/uvrt/pptx2svg/blob/main/ROADMAP.md"

[project.scripts]
pptx2svg = "pptx2svg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
